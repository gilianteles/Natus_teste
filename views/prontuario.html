<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Natus - Prontuário Eletrônico (PEP)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <script src="/natus-rpc.js"></script>
  <!--@head-->
</head>
<body class="nt-body">
<div class="app-shell">
  <!--@rail-->

  <section class="content">
    <header class="nt-topbar">
      <div>
        <div class="nt-crumb"><span>Natus</span><i class="bi bi-chevron-right"></i><span>Assistência</span><i class="bi bi-chevron-right"></i><span>Prontuário</span></div>
        <h1 class="nt-title">Prontuário Eletrônico · PEP</h1>
      </div>
      <div class="nt-actions">
        <span class="nt-chip"><span class="nt-live"></span><span id="pepSync">Carregando...</span></span>
        <button class="btn btn-light btn-sm" onclick="carregarProntuario()" title="Atualizar"><i class="bi bi-arrow-clockwise me-1"></i>Atualizar</button>
        <button class="btn btn-light btn-sm" onclick="pepBaixarCSV()" title="Exportar prontuário (CSV)"><i class="bi bi-filetype-csv me-1"></i>Exportar CSV</button>
        <!--@useractions-->
      </div>
    </header>

    <main class="main nt-page">
      <div id="pepConteudo">
        <div class="empty"><div class="spinner-border spinner-border-sm text-info"></div><div class="mt-2">Abrindo o prontuário...</div></div>
      </div>
    </main>
  </section>
</div>

<!-- Evolução SOAP -->
<div class="modal fade" id="modalEvolucaoSOAP" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header natus"><h5 class="modal-title fw-bold"><i class="bi bi-journal-text me-2"></i>Evolução clínica (SOAP)</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="row g-2 mb-2">
          <div class="col-md-4"><label class="form-label">Categoria</label><select class="form-select" id="soapCategoria"></select></div>
          <div class="col-md-4"><label class="form-label">Profissional</label><input class="form-control" id="soapProfissional" placeholder="Nome do profissional"></div>
          <div class="col-md-2"><label class="form-label">Data</label><input type="date" class="form-control" id="soapData"></div>
          <div class="col-md-2"><label class="form-label">Hora</label><input type="time" class="form-control" id="soapHora"></div>
        </div>
        <div class="row g-2">
          <div class="col-md-6"><label class="form-label"><b>S</b> — Subjetivo</label><textarea class="form-control" id="soapS" rows="3" placeholder="Queixas, anamnese..."></textarea></div>
          <div class="col-md-6"><label class="form-label"><b>O</b> — Objetivo</label><textarea class="form-control" id="soapO" rows="3" placeholder="Exame físico, sinais vitais, exames..."></textarea></div>
          <div class="col-md-6"><label class="form-label"><b>A</b> — Avaliação</label><textarea class="form-control" id="soapA" rows="3" placeholder="Diagnóstico / impressão clínica..."></textarea></div>
          <div class="col-md-6"><label class="form-label"><b>P</b> — Plano</label><textarea class="form-control" id="soapP" rows="3" placeholder="Condutas, prescrições, cuidados..."></textarea></div>
        </div>
      </div>
      <div class="modal-footer"><button class="btn btn-light" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-natus fw-semibold" type="button" onclick="pepSalvarEvolucao()"><i class="bi bi-check-lg me-1"></i>Registrar evolução</button></div>
    </div>
  </div>
</div>

<!-- Prescrição -->
<div class="modal fade" id="modalPrescricao" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header natus"><h5 class="modal-title fw-bold"><i class="bi bi-capsule me-2"></i>Nova prescrição</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="row g-2">
          <div class="col-md-4"><label class="form-label">Tipo</label><select class="form-select" id="prescTipo"></select></div>
          <div class="col-md-4"><label class="form-label">Situação</label><select class="form-select" id="prescStatus"></select></div>
          <div class="col-md-4"><label class="form-label">Profissional</label><input class="form-control" id="prescProfissional" placeholder="Prescritor"></div>
          <div class="col-12"><label class="form-label">Descrição</label><input class="form-control" id="prescDescricao" placeholder="Ex.: Ampicilina + Gentamicina"></div>
          <div class="col-md-3"><label class="form-label">Dose</label><input class="form-control" id="prescDose" placeholder="Ex.: 100 mg"></div>
          <div class="col-md-3"><label class="form-label">Via</label><input class="form-control" id="prescVia" placeholder="Ex.: EV"></div>
          <div class="col-md-3"><label class="form-label">Frequência</label><input class="form-control" id="prescFrequencia" placeholder="Ex.: 12/12h"></div>
          <div class="col-md-3"><label class="form-label">Data/Hora</label><input type="datetime-local" class="form-control" id="prescDataHora"></div>
          <div class="col-12"><label class="form-label">Observações</label><textarea class="form-control" id="prescObservacao" rows="2"></textarea></div>
        </div>
      </div>
      <div class="modal-footer"><button class="btn btn-light" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-natus fw-semibold" type="button" onclick="pepSalvarPrescricao()"><i class="bi bi-check-lg me-1"></i>Prescrever</button></div>
    </div>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="pepToasts"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const token = "<?!= token ?>", appUrl = "<?!= appUrl ?>";
  window.PEP = { token: token, appUrl: appUrl, idInternacao: "<?!= idInternacao ?>" };
</script>
</body>
</html>
